name: dino_run
description: A 2D infinite side scroller.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flame: 1.36.0
  flame_audio: 2.12.0
  hive: 2.2.3
  path_provider: 2.1.5
  provider: 6.1.5+1
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.9
  # EduPlay educational ad-break SDK. Build-machine-local path dep because the
  # package is not yet on pub.dev (Track J evaluation). Swap for a pub.dev
  # version range once eduplay_ads publishes.
  eduplay_ads:
    path: /home/lloydho/eduplay/sdk/flutter

dev_dependencies:
  hive_generator: 2.0.1
  build_runner: 2.4.13
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/parallax/
    - assets/images/AngryPig/
    - assets/images/Bat/
    - assets/images/Rino/
    - assets/audio/

  fonts:
    - family: Audiowide
      fonts:
        - asset: assets/fonts/Audiowide/Audiowide-Regular.ttf
